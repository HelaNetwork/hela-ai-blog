<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" shape-rendering="crispEdges">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P');
      text { font-family: "Press Start 2P", monospace; }
    </style>
  </defs>
  <!-- background -->
  <rect width="120" height="80" fill="#0d0d0d"/>
  <!-- terminal window frame -->
  <rect x="4" y="4" width="112" height="72" fill="#0d0d0d" stroke="#ffb300" stroke-width="1"/>
  <!-- title bar -->
  <rect x="4" y="4" width="112" height="10" fill="#ffb300"/>
  <text x="8" y="12" font-size="5" fill="#0d0d0d">HELA TESTNET</text>
  <!-- dot indicators -->
  <rect x="106" y="6" width="4" height="4" fill="#ff1744"/>
  <!-- terminal body -->
  <text x="8" y="26" font-size="4" fill="#00e5ff">$ connect --chain</text>
  <text x="8" y="34" font-size="4" fill="#b2ff59">666888</text>
  <text x="8" y="44" font-size="4" fill="#ffb300">EVM READY</text>
  <!-- cursor blink block -->
  <rect x="8" y="53" width="4" height="5" fill="#ffffff"/>
  <!-- status bar -->
  <rect x="4" y="68" width="112" height="8" fill="#ffb300"/>
  <text x="8" y="75" font-size="4" fill="#0d0d0d">TESTNET LIVE</text>
</svg>