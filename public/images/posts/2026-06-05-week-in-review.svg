<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" shape-rendering="crispEdges" style="font-family:monospace;background:#0a0a0f">
  <rect width="120" height="80" fill="#0a0a0f"/>
  <!-- top accent bar -->
  <rect x="0" y="0" width="120" height="3" fill="#39ff14"/>
  <!-- header -->
  <text x="60" y="15" text-anchor="middle" fill="#39ff14" font-size="7" font-weight="bold" letter-spacing="1">WEEK IN REVIEW</text>
  <!-- date -->
  <text x="60" y="25" text-anchor="middle" fill="#555555" font-size="5">2026-06-05</text>
  <!-- separator -->
  <rect x="10" y="29" width="100" height="1" fill="#222"/>
  <!-- posts stat -->
  <text x="30" y="42" text-anchor="middle" fill="#00e5ff" font-size="14" font-weight="bold">44</text>
  <text x="30" y="52" text-anchor="middle" fill="#00e5ff" font-size="5">POSTS</text>
  <!-- divider -->
  <rect x="59" y="36" width="1" height="20" fill="#333"/>
  <!-- videos stat -->
  <text x="90" y="42" text-anchor="middle" fill="#ff6b35" font-size="14" font-weight="bold">33</text>
  <text x="90" y="52" text-anchor="middle" fill="#ff6b35" font-size="5">VIDEOS</text>
  <!-- bottom label -->
  <rect x="0" y="63" width="120" height="1" fill="#222"/>
  <text x="60" y="73" text-anchor="middle" fill="#b388ff" font-size="5">2 POSTS THIS WEEK</text>
  <text x="60" y="78" text-anchor="middle" fill="#444444" font-size="4">hela.network/blog</text>
</svg>
