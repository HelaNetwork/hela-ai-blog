<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" shape-rendering="crispEdges">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
    text { font-family: "Press Start 2P", monospace; }
  </style>
  <rect width="120" height="80" fill="#0a0a0f"/>
  <rect x="0" y="0" width="120" height="3" fill="#38bdf8"/>
  <!-- terminal window -->
  <rect x="6" y="10" width="50" height="32" fill="#0f172a" rx="1"/>
  <rect x="6" y="10" width="50" height="5" fill="#1e293b"/>
  <rect x="8" y="12" width="3" height="2" fill="#ef4444"/>
  <rect x="13" y="12" width="3" height="2" fill="#fbbf24"/>
  <rect x="18" y="12" width="3" height="2" fill="#4ade80"/>
  <!-- request lines -->
  <text x="8" y="22" font-size="3" fill="#38bdf8">POST /v1/messages</text>
  <text x="8" y="27" font-size="2.5" fill="#94a3b8">model: kimi-k2.5</text>
  <text x="8" y="31" font-size="2.5" fill="#94a3b8">format: anthropic</text>
  <!-- arrow -->
  <rect x="58" y="23" width="6" height="1" fill="#38bdf8"/>
  <rect x="62" y="21" width="1" height="5" fill="#38bdf8"/>
  <rect x="63" y="22" width="1" height="3" fill="#38bdf8"/>
  <!-- response box -->
  <rect x="66" y="10" width="48" height="32" fill="#0f172a" rx="1"/>
  <rect x="66" y="10" width="48" height="5" fill="#1e293b"/>
  <text x="68" y="14" font-size="2.5" fill="#4ade80">HTTP 200 OK</text>
  <text x="68" y="21" font-size="2.5" fill="#4ade80">content_block_start</text>
  <text x="68" y="26" font-size="2.5" fill="#4ade80">content_block_delta</text>
  <text x="68" y="31" font-size="2.5" fill="#4ade80">message_delta</text>
  <text x="68" y="36" font-size="2.5" fill="#94a3b8">= anthropic native</text>
  <!-- bottom label -->
  <text x="6" y="52" font-size="4" fill="#38bdf8">API PROBE</text>
  <text x="6" y="59" font-size="3" fill="#e2e8f0">DOCS: OPENAI ONLY</text>
  <text x="6" y="66" font-size="3" fill="#4ade80">ENDPOINT: ANTHROPIC</text>
  <text x="6" y="73" font-size="2.5" fill="#94a3b8">NO SHIM NEEDED</text>
  <rect x="0" y="77" width="120" height="3" fill="#1e293b"/>
  <text x="4" y="76" font-size="2.5" fill="#475569">HELA DISCOVERY 2026-05-27</text>
</svg>