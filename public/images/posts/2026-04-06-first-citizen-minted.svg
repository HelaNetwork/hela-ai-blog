<svg width="120" height="80" viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg" style="image-rendering:pixelated;">
  <!-- background -->
  <rect width="120" height="80" fill="#020a14"/>
  <!-- chain links (bottom decoration) -->
  <rect x="10" y="56" width="8" height="6" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.3"/>
  <rect x="18" y="56" width="8" height="6" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.3"/>
  <rect x="26" y="56" width="8" height="6" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.3"/>
  <!-- heart-shaped citizen ID (center) -->
  <rect x="48" y="8" width="6" height="6" fill="#00e5ff" opacity="0.6"/>
  <rect x="58" y="8" width="6" height="6" fill="#00e5ff" opacity="0.6"/>
  <rect x="44" y="12" width="24" height="6" fill="#00e5ff" opacity="0.5"/>
  <rect x="46" y="18" width="20" height="6" fill="#00e5ff" opacity="0.4"/>
  <rect x="48" y="24" width="16" height="6" fill="#00e5ff" opacity="0.35"/>
  <rect x="50" y="30" width="12" height="6" fill="#00e5ff" opacity="0.3"/>
  <rect x="52" y="36" width="8" height="4" fill="#00e5ff" opacity="0.25"/>
  <rect x="54" y="40" width="4" height="4" fill="#00e5ff" opacity="0.2"/>
  <!-- NFT badge inside heart -->
  <rect x="52" y="18" width="8" height="8" fill="#020a14" stroke="#00e5ff" stroke-width="1"/>
  <rect x="54" y="20" width="4" height="4" fill="#00e5ff" opacity="0.8"/>
  <!-- checkmark (mint success) -->
  <rect x="80" y="18" width="4" height="2" fill="#00ff88"/>
  <rect x="84" y="14" width="2" height="6" fill="#00ff88"/>
  <rect x="78" y="16" width="2" height="2" fill="#00ff88"/>
  <!-- wallet icon (TBA) -->
  <rect x="12" y="14" width="18" height="14" fill="#041a24" stroke="#00e5ff" stroke-width="1" opacity="0.6"/>
  <rect x="14" y="18" width="14" height="2" fill="#00e5ff" opacity="0.3"/>
  <rect x="14" y="22" width="10" height="2" fill="#00e5ff" opacity="0.3"/>
  <rect x="26" y="16" width="6" height="4" fill="#041a24" stroke="#00e5ff" stroke-width="1" opacity="0.6"/>
  <!-- gas-free indicator -->
  <rect x="84" y="30" width="24" height="10" fill="#041a24" stroke="#00e5ff" stroke-width="0.5"/>
  <text x="96" y="37" font-family="'Press Start 2P',monospace" font-size="3" fill="#00e5ff" text-anchor="middle" opacity="0.8">GAS=0</text>
  <!-- MPC key shards -->
  <rect x="88" y="46" width="4" height="8" fill="#00e5ff" opacity="0.3"/>
  <rect x="94" y="44" width="4" height="10" fill="#00e5ff" opacity="0.4"/>
  <rect x="100" y="48" width="4" height="6" fill="#00e5ff" opacity="0.3"/>
  <!-- tx hash fragment -->
  <rect x="36" y="50" width="48" height="6" fill="#020a14" stroke="#00e5ff" stroke-width="0.5" opacity="0.5"/>
  <text x="60" y="55" font-family="monospace" font-size="3" fill="#00e5ff" text-anchor="middle" opacity="0.4">0x6dfa0516...</text>
  <!-- bottom label -->
  <text x="60" y="74" font-family="'Press Start 2P',monospace" font-size="4" fill="#00e5ff" text-anchor="middle">CITIZEN #1</text>
</svg>
