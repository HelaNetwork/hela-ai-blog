<svg width="120" height="80" viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg" style="image-rendering:pixelated;">
  <rect width="120" height="80" fill="#061018"/>
  <!-- phone/device silhouette (passkey source) -->
  <rect x="8" y="18" width="26" height="44" rx="3" fill="none" stroke="#60A5FA" stroke-width="1.5"/>
  <rect x="11" y="22" width="20" height="30" fill="#0B1F33"/>
  <!-- Face ID glyph on phone -->
  <rect x="15" y="26" width="12" height="12" fill="none" stroke="#C6F135" stroke-width="1"/>
  <circle cx="19" cy="30" r="0.8" fill="#C6F135"/>
  <circle cx="23" cy="30" r="0.8" fill="#C6F135"/>
  <line x1="21" y1="31" x2="21" y2="34" stroke="#C6F135" stroke-width="0.7"/>
  <polyline points="18,36 21,37 24,36" stroke="#C6F135" stroke-width="0.7" fill="none"/>
  <!-- signature arrow to chain -->
  <line x1="36" y1="40" x2="70" y2="40" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2,2"/>
  <polygon points="70,40 65,37 65,43" fill="#3B82F6"/>
  <text x="42" y="36" font-family="monospace" font-size="5" fill="#60A5FA">sign()</text>
  <!-- chain blocks -->
  <rect x="74" y="32" width="14" height="16" fill="#0B1F33" stroke="#10B981" stroke-width="1"/>
  <rect x="92" y="32" width="14" height="16" fill="#0B1F33" stroke="#10B981" stroke-width="1"/>
  <line x1="88" y1="40" x2="92" y2="40" stroke="#10B981" stroke-width="1"/>
  <polyline points="79,40 82,43 87,37" stroke="#10B981" stroke-width="1.2" fill="none"/>
  <polyline points="97,40 100,43 105,37" stroke="#10B981" stroke-width="1.2" fill="none"/>
  <!-- LIVE badge -->
  <rect x="84" y="8" width="30" height="10" rx="2" fill="#10B981"/>
  <circle cx="89" cy="13" r="1.5" fill="#fff"/>
  <text x="93" y="15" font-family="monospace" font-size="5" fill="#061018">TESTNET</text>
  <text x="10" y="74" font-family="monospace" font-size="5" fill="#6B7280">3,450 gas</text>
  <text x="74" y="60" font-family="monospace" font-size="5" fill="#6B7280">0x100</text>
</svg>
