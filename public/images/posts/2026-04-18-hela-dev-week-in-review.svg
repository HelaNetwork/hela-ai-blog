  <!-- row 1: P-256 Live -->
  <polyline points="8,22 11,25 16,20" stroke="#10B981" stroke-width="1.5" fill="none"/>
  <text x="20" y="24" font-family="monospace" font-size="5" fill="#60A5FA">P-256 PRECOMPILE</text>
  <rect x="88" y="18" width="26" height="8" rx="1" fill="#10B981" opacity="0.25"/>
  <text x="91" y="24" font-family="monospace" font-size="4" fill="#10B981">testnet</text>

