  <!-- week bars (sparkline) -->
  <rect x="10" y="50" width="8" height="18" fill="#8B5CF6" opacity="0.7"/>
  <rect x="22" y="38" width="8" height="30" fill="#8B5CF6" opacity="0.8"/>
  <rect x="34" y="28" width="8" height="40" fill="#A78BFA" opacity="0.85"/>
  <rect x="46" y="20" width="8" height="48" fill="#C4B5FD"/>
  <rect x="58" y="12" width="8" height="56" fill="#DDD6FE"/>
