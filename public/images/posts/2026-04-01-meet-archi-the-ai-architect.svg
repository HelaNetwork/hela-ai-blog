<svg width="120" height="80" viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg" style="image-rendering:pixelated;">
  <!-- background -->
  <rect width="120" height="80" fill="#0a0618"/>
  <!-- blueprint grid -->
  <rect x="4" y="4" width="112" height="60" fill="none" stroke="#a855f6" stroke-width="0.5" opacity="0.15"/>
  <line x1="4" y1="20" x2="116" y2="20" stroke="#a855f6" stroke-width="0.5" opacity="0.1"/>
  <line x1="4" y1="36" x2="116" y2="36" stroke="#a855f6" stroke-width="0.5" opacity="0.1"/>
  <line x1="4" y1="52" x2="116" y2="52" stroke="#a855f6" stroke-width="0.5" opacity="0.1"/>
  <line x1="30" y1="4" x2="30" y2="64" stroke="#a855f6" stroke-width="0.5" opacity="0.1"/>
  <line x1="60" y1="4" x2="60" y2="64" stroke="#a855f6" stroke-width="0.5" opacity="0.1"/>
  <line x1="90" y1="4" x2="90" y2="64" stroke="#a855f6" stroke-width="0.5" opacity="0.1"/>
  <!-- architecture boxes (system diagram) -->
  <rect x="10" y="8" width="20" height="10" fill="#1a0830" stroke="#a855f6" stroke-width="1"/>
  <rect x="50" y="8" width="20" height="10" fill="#1a0830" stroke="#a855f6" stroke-width="1"/>
  <rect x="90" y="8" width="20" height="10" fill="#1a0830" stroke="#a855f6" stroke-width="1"/>
  <!-- connection lines -->
  <line x1="30" y1="13" x2="50" y2="13" stroke="#a855f6" stroke-width="1" opacity="0.6"/>
  <line x1="70" y1="13" x2="90" y2="13" stroke="#a855f6" stroke-width="1" opacity="0.6"/>
  <!-- arrow heads -->
  <rect x="47" y="12" width="3" height="2" fill="#a855f6" opacity="0.6"/>
  <rect x="87" y="12" width="3" height="2" fill="#a855f6" opacity="0.6"/>
  <!-- Archi character (center) -->
  <rect x="44" y="26" width="20" height="14" fill="#1a0830"/>
  <rect x="47" y="30" width="4" height="4" fill="#a855f6" opacity="0.7"/>
  <rect x="55" y="30" width="4" height="4" fill="#a855f6" opacity="0.7"/>
  <rect x="44" y="40" width="20" height="18" fill="#120620"/>
  <!-- compass/protractor tool -->
  <rect x="70" y="30" width="12" height="2" fill="#a855f6" opacity="0.5"/>
  <rect x="76" y="26" width="2" height="12" fill="#a855f6" opacity="0.5"/>
  <rect x="72" y="28" width="8" height="8" fill="none" stroke="#a855f6" stroke-width="1" opacity="0.4"/>
  <!-- HIP document -->
  <rect x="12" y="28" width="16" height="20" fill="#120620" stroke="#a855f6" stroke-width="1" opacity="0.7"/>
  <rect x="14" y="31" width="12" height="2" fill="#a855f6" opacity="0.4"/>
  <rect x="14" y="35" width="10" height="2" fill="#a855f6" opacity="0.3"/>
  <rect x="14" y="39" width="8" height="2" fill="#a855f6" opacity="0.3"/>
  <rect x="14" y="43" width="11" height="2" fill="#a855f6" opacity="0.2"/>
  <!-- bottom label -->
  <text x="60" y="74" font-family="'Press Start 2P',monospace" font-size="4" fill="#a855f6" text-anchor="middle">CHIEF ARCHITECT</text>
</svg>
